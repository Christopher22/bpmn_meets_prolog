name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # clang cross-compiles ring (a Scryer Prolog dependency) to wasm32.
      - run: sudo apt-get update && sudo apt-get install -y clang
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - id: pages
        uses: actions/configure-pages@v5
      # The site is served from https://<owner>.github.io/<repo>/.
      - run: trunk build --release --public-url "${{ steps.pages.outputs.base_path }}/"
        working-directory: crates/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: crates/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
